[project]
name = "SynPlanner-Wrapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
  "retrocast==0.6.0",
  "synplanner>=1.3.2",
