[project]
name = "synllama-wrapper"
version = "0.1.0"
description = "Isolated SynLlama CSV converter for RetroCast tasks"
requires-python = ">=3.11"
dependencies = [
    "retrocast==0.8.2",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.12",
]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "7 days"

[tool.uv.sources]
# Remove this source override once RetroCast 0.8.2 is published.
retrocast = { git = "https://github.com/ischemist/project-procrustes.git", rev = "969f59dd7a849af8341bae91e6d8765925b89bc5b" }

[tool.hatch.build.targets.wheel]
packages = ["synllama_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
