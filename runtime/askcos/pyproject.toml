[project]
name = "askcos-wrapper"
version = "0.1.0"
description = "Isolated ASKCOS HTTP runner for RetroCast tasks"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "retrocast==0.8.2",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20250822",
    "types-requests>=2.32.4.20260107",
]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "7 days"
exclude-newer-package = { retrocast = "2026-07-28T05:08:39Z" }

[tool.hatch.build.targets.wheel]
packages = ["askcos_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
