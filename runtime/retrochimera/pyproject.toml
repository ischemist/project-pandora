[project]
name = "retrochimera-gather-runtime"
version = "0.1.0"
description = "Isolated Pandora gather runtime for RetroChimera raw outputs"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "retrocast==0.8.2",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.12",
]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "7 days"

[tool.uv.sources]
retrocast = { git = "https://github.com/ischemist/project-procrustes.git", rev = "969f59dd7a849af8341bae91e6d8765925b89bc5" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
