[project]
name = "dreamretroer-wrapper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "retrocast @ git+https://github.com/ischemist/project-procrustes.git@969f59dd7a849af8341bae91e6d8765925b89bc5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.12",
]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
