resources:
  reaction_rules: data/retrocast/0-assets/model-configs/synplanner/uspto/uspto_reaction_rules.pickle
  ranking_weights: data/retrocast/0-assets/model-configs/synplanner/uspto/weights/ranking_policy_network.ckpt
  filtering_weights: data/retrocast/0-assets/model-configs/synplanner/uspto/weights/filtering_policy_network.ckpt
  value_weights: data/retrocast/0-assets/model-configs/synplanner/uspto/weights/value_network.ckpt
tree:
  max_iterations: 100
  max_tree_size: 1000000
  max_time: 600
  max_depth: 10
  algorithm: uct
  search_strategy: evaluation_first
  ucb_type: uct
  c_ucb: 0.1
  backprop_type: muzero
  normalize_scores: False
  exclude_small: True
  init_node_value: 0.5
  min_mol_size: 0
  epsilon: 0.0
  beam_width: 10
  enable_pruning: False
  silent: True
node_evaluation:
  evaluation_type: gcn
  evaluation_agg: max
node_expansion:
  top_rules: 50
  rule_prob_threshold: 0.0
  mode: ranking
