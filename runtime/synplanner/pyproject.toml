[project]
name = "SynPlanner-Wrapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
  "retrocast==0.8.2",
  "synplanner>=1.3.2",
]

[tool.uv]
# Require a short cooling-off window before newly uploaded artifacts are eligible.
required-version = ">=0.9.17"
exclude-newer = "7 days"
exclude-newer-package = { gitpython = "2026-07-23T02:52:44Z", retrocast = "2026-07-28T05:08:39Z" }
constraint-dependencies = [
  "gitpython>=3.1.55",
  "pygments>=2.20",
  "torch>=2.13",
]
